<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Inline ani Internal css hya paki important Inline css ahe 
        samja don h2 ghetle tr jo last ahe to color ghenar pan tya 
        mde kahi tri nasel tr to vr cha h2 parat ghenar (for ex:khali firest h2 la font-size ahe pan second h2 la nahi tr to font-size pan ghenar) */
        /* Iternal css body chya style mde asta  */
        h2{
            color: aquamarine;
            background-color: blueviolet; 
            font-size:50px;
        }
        h1{
            color: blueviolet !important;
            background-color: pink !important;
            font-size: 50px;
        }
        h2{
           color:red;
            background-color: aqua;
        }
        
    </style>
    <link href="css/style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <h4>Welcome Aditi</h4>
    <h3>Welcome Sneha</h3>
    <!-- Internal CSS -->
     <h2>Welcome Aditi</h2>
     <h2>I am from Pune </h2>
   <!-- Inline CSS  -->
   <h1 style="color: palevioletred;background-color: pink;font-size: 50px;">Hello Its Aditi</h1>

   <h1 style="color: red;background-color:skyblue;font-size: 50px;">Hello Its Aditi</h1>
   <h1>My name is Aditi</h1>
</body>
</html>
